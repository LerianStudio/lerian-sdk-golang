name: "Release Notifications"

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  github-release-notification:
    name: Notify Discord and Slack of New Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Fetch Latest Release
        id: latest_release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Releases to Discord
        uses: SethCohen/github-releases-to-discord@6ac5abea42b8cbac14316970819a8a535aab08ea # v1.16.2
        if: ${{ !contains(github.ref, '-beta.') }}
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          color: "2105893"
          username: "Release Changelog"
          content: "<@&1346912737380274176>"
          footer_timestamp: true

      - name: Notify Slack of New Release
        uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        env:
          SLACK_CHANNEL: "lerian-product-release"
          SLACK_COLOR: "#36a64f"
          SLACK_ICON_EMOJI: ":rocket:"
          SLACK_TITLE: "Lerian Go SDK New Release: ${{ steps.latest_release.outputs.tag }}"
          SLACK_MESSAGE: "🎉 *New Release Published!* \n \n <https://github.com/${{ github.repository }}/releases/tag/${{ steps.latest_release.outputs.tag }} | *Click here for details*>"
          SLACK_WEBHOOK: ${{ secrets.RELEASE_WEBHOOK_NOTIFICATION_URL }}
